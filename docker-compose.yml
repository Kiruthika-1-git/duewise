services:
  postgres:
    image: postgres:17
    container_name: duewise-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: duewise_db
      POSTGRES_USER: duewise_user
      POSTGRES_PASSWORD: duewise_dev_password
    ports:
      - "5432:5432"
    volumes:
      - duewise_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U duewise_user -d duewise_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: duewise-backend
    restart: unless-stopped
    environment:
      PORT: "3000"
      DATABASE_URL: postgresql://duewise_user:duewise_dev_password@postgres:5432/duewise_db
    ports:
      - "3001:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  duewise_postgres_data: